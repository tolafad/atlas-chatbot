# Push to main  -> test, build the image, push it to ECR, deploy it to the EC2 instance, verify.
# Push a tag v* -> same, and the image is also tagged with that version (v1.3.0 -> 1.3.0).
# Run manually  -> Actions tab > "Deploy to EC2" > Run workflow. Optionally enter an existing
#                  image tag (e.g. sha-1a2b3c4 or 1.2.0) to redeploy / roll back without building.
#
# AWS access uses GitHub OIDC (no stored AWS keys). One-time setup: deploy/setup-github-deploy.sh
# (explained in deploy/README.md, step 6). It creates, on the `production` environment:
#   secret   AWS_DEPLOY_ROLE_ARN  role GitHub Actions assumes
#   variable EC2_INSTANCE_ID      instance that runs the `atlas` container
#   variable APP_URL              link shown on the deployment
name: Deploy to EC2

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to deploy instead of building (leave empty to build this commit)"
        required: false
        default: ""

# One deployment at a time; a newer push waits for the running one instead of cancelling it mid-deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2        # ECR + EC2 region (Bedrock calls stay in us-east-1, set in the image)
  ECR_REPOSITORY: atlas-chatbot

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Compile check
        run: |
          uv run python -m compileall -q app.py db.py
          node --check static/js/chat.js
          node --check static/js/auth.js

      - name: Smoke test (auth, free-message limit, health) with a stubbed Bedrock
        env:
          DATABASE_PATH: ${{ runner.temp }}/smoke.db
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: |
          uv run python - <<'EOF'
          import app, db

          db.init_db()

          class FakeBedrock:
              def converse_stream(self, **kw):
                  return {"stream": [
                      {"contentBlockDelta": {"delta": {"text": "hi"}}},
                      {"messageStop": {"stopReason": "end_turn"}},
                      {"metadata": {"usage": {"inputTokens": 1, "outputTokens": 1}}},
                  ]}

          app.bedrock = FakeBedrock()
          c = app.app.test_client()
          H = {"Origin": "http://localhost"}

          def expect(resp, code, what):
              assert resp.status_code == code, f"{what}: expected {code}, got {resp.status_code} {resp.get_data(as_text=True)[:200]}"
              print(f"ok  {what} -> {code}")

          expect(c.get("/api/health"), 200, "health")
          expect(c.get("/"), 302, "index redirects when signed out")
          expect(c.get("/signin"), 200, "signin page")
          expect(c.get("/signup"), 200, "signup page")
          expect(c.post("/api/auth/signup", json={"email": "x", "password": "password123"}, headers=H), 400, "signup rejects bad email")
          expect(c.post("/api/auth/signup", json={"email": "ci@example.com", "password": "password123"}, headers=H), 201, "signup")
          expect(c.post("/api/auth/signup", json={"email": "CI@example.com", "password": "password123"}, headers=H), 409, "duplicate signup")
          expect(c.get("/"), 200, "index when signed in")
          expect(c.post("/api/auth/signout", json={}, headers=H), 204, "signout")
          expect(c.get("/api/auth/me"), 401, "me after signout")
          expect(c.post("/api/auth/signin", json={"email": "ci@example.com", "password": "wrong-pass"}, headers=H), 401, "signin wrong password")
          expect(c.post("/api/auth/signin", json={"email": "ci@example.com", "password": "password123"}, headers=H), 200, "signin")

          conv = c.post("/api/conversations", json={}, headers=H).get_json()
          cid = conv.get("id") or conv.get("conversation", {}).get("id")
          limit = app.FREE_MESSAGE_LIMIT
          for i in range(limit):
              r = c.post(f"/api/conversations/{cid}/messages", json={"content": f"m{i}"}, headers=H)
              r.get_data()
              assert r.status_code == 200, f"message {i + 1} failed: {r.status_code}"
          print(f"ok  {limit} free messages sent")
          expect(c.post(f"/api/conversations/{cid}/messages", json={"content": "one more"}, headers=H), 402, "free limit enforced")
          EOF

  deploy:
    name: Build, push & deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The AWS role trusts only this environment, and the environment only allows main and v* tags.
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write   # for AWS OIDC
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: atlas-deploy-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Decide image tags
        id: tags
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "deploy_tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Redeploying existing image tag: $INPUT_TAG"
            exit 0
          fi
          SHA_TAG="sha-${GITHUB_SHA::7}"
          TAGS="$REGISTRY/$ECR_REPOSITORY:$SHA_TAG,$REGISTRY/$ECR_REPOSITORY:latest"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAGS="$TAGS,$REGISTRY/$ECR_REPOSITORY:${GITHUB_REF_NAME#v}"
          fi
          echo "deploy_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Image tags: $TAGS"

      - name: Check the image tag exists in ECR
        if: steps.tags.outputs.build == 'false'
        run: aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="${{ steps.tags.outputs.deploy_tag }}" >/dev/null

      - name: Set up Docker Buildx
        if: steps.tags.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (linux/amd64)
        if: steps.tags.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Deploy to EC2 via SSM and verify
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tags.outputs.deploy_tag }}
        run: |
          set -euo pipefail
          SCRIPT=$(printf 'REGISTRY=%q\nTAG=%q\n' "$REGISTRY" "$TAG"; cat deploy/remote-deploy.sh)
          jq -n --arg s "$SCRIPT" '{commands: [$s], executionTimeout: ["600"]}' > ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "atlas deploy $TAG (run ${{ github.run_id }})" \
            --parameters file://ssm-params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          STATUS=Pending
          for _ in $(seq 1 120); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          echo "----- output from the instance -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          ERR=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text | grep -v -e 'WARNING! Your password' -e 'credential helper' -e 'credentials-store' -e '^$' || true)
          [ -n "$ERR" ] && { echo "----- stderr -----"; echo "$ERR"; }

          if [ "$STATUS" != Success ]; then
            echo "::error::Deployment of $TAG failed on the instance (SSM status: $STATUS). See output above."
            exit 1
          fi
          {
            echo "### Deployed \`$TAG\`"
            echo "- Instance: \`$INSTANCE_ID\`"
            echo "- Health checks on ports 80 and 8000 passed on the instance"
          } >> "$GITHUB_STEP_SUMMARY"
